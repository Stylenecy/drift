name: ci

# Runs DRIFT's three test layers on every push and pull request.
# Actions are pinned to commit SHAs (tag in the trailing comment).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts · forge test + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.5.1
      - name: Install forge-std (not vendored; pinned to the commit the tests were run with)
        run: |
          git init -q lib/forge-std
          git -C lib/forge-std fetch -q --depth 1 https://github.com/foundry-rs/forge-std 6764d4a42fcdff8e9f6999ab94fb74c1752a0445
          git -C lib/forge-std checkout -q FETCH_HEAD
      - name: Unit, fuzz and invariant tests
        run: forge test -vv
      - name: Coverage of MacroGuard.sol
        run: forge coverage --report summary --no-match-coverage "(script|test)"

  engine:
    name: engine · pytest (offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        # Same invocation as local runs: never from apps/trader, where the engine
        # would look for a .env.local (there is none in CI, but keep one habit).
        working-directory: apps
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/trader/requirements-dev.txt
      - run: pip install -r trader/requirements-dev.txt
      - name: Tests (no network, no .env)
        run: python -m pytest trader/tests -c trader/pytest.ini

  web:
    name: web · lint + node test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test --workspace @drift/web
      - run: npm run build
        env:
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
